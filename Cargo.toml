[workspace]
members = [
    "basis-points",
    "solana-safe-math",
    "wrapped-decimal",
]
default-members = [
    "basis-points",
    "solana-safe-math",
    "wrapped-decimal",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "1.0.2" }
basis-points = { path = "basis-points" }
bytemuck = { version = "1.20.0", features = ["derive", "min_const_generics"] }
codama = { version = "0.9.2" }
rust_decimal = { version = "1.42.0", features = ["maths"] }
thiserror = { version = "2.0.18" }
husky-rs = { version = "0.3.3" }
zeropod = { version = "=0.3.3" }

[workspace.metadata.changeset]
commit = false
tags = false
keep-changesets = false
tag-format = "crate-prefixed"
changelog = "per-package"
comparison-links = "disabled"
zero-version-behavior = "effective-minor"
base-branch = "main"
none-bump-behavior = "promote-to-patch"
