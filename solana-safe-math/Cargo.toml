[package]
name = "solana-safe-math"
version = "0.1.1"
edition = "2024"
description = "Checked arithmetic and conversion traits for Solana-oriented Rust."
license = "MIT"
repository = "https://github.com/ChiefWoods/solana-math"
homepage = "https://github.com/ChiefWoods/solana-math"
documentation = "https://docs.rs/solana-safe-math"
readme = "README.md"
keywords = ["solana", "math", "checked", "overflow"]
categories = ["cryptography::cryptocurrencies", "mathematics"]
rust-version = "1.85"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE*", "CHANGELOG.md"]

[features]
default = ["u8", "u16", "u32", "u64", "u128", "i8", "i16", "i32", "i64", "i128"]
u8 = []
u16 = []
u32 = []
u64 = []
u128 = []
i8 = []
i16 = []
i32 = []
i64 = []
i128 = []
decimal = ["dep:rust_decimal"]

[dependencies]
rust_decimal = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
husky-rs = { workspace = true }

[package.metadata.docs.rs]
all-features = true
