[package]
name = "solana-math"
version = "0.2.0"
edition = "2024"
description = "Checked arithmetic and conversion traits for Solana-oriented Rust."
license = "MIT"
repository = "https://github.com/ChiefWoods/solana-math"
homepage = "https://github.com/ChiefWoods/solana-math"
documentation = "https://docs.rs/solana-math"
readme = "README.md"
keywords = ["solana", "math", "checked", "overflow"]
categories = ["cryptography::cryptocurrencies", "mathematics"]
rust-version = "1.85"
include = ["src/**/*", "Cargo.toml", "README.md", "LICENSE*", "CHANGELOG.md"]

[features]
default = ["u8", "u16", "u32", "u64", "u128", "i8", "i16", "i32", "i64", "i128"]
u8 = []
u16 = []
u32 = []
u64 = []
u128 = []
i8 = []
i16 = []
i32 = []
i64 = []
i128 = []
std = ["thiserror/std"]
debug = ["std"]
decimal = ["dep:rust_decimal"]
basis-points = ["dep:basis-points"]
brine-fp = ["dep:brine-fp"]
anchor = ["std", "dep:anchor-lang"]
quasar = ["dep:quasar-lang", "dep:zeropod"]

[dependencies]
anchor-lang = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
basis-points = { workspace = true, optional = true }
brine-fp = { workspace = true, optional = true }
quasar-lang = { workspace = true, optional = true }
thiserror = { workspace = true }
zeropod = { workspace = true, optional = true }

[dev-dependencies]
husky-rs = { workspace = true }

[package.metadata.docs.rs]
all-features = true
