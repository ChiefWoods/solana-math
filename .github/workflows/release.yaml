name: Release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags:
      - 'basis-points@v*'
      - 'wrapped-decimal@v*'
      - 'solana-math@v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    env:
      NO_HUSKY_HOOKS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Parse tag and verify Cargo.toml
        id: meta
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^([a-z0-9-]+)@v([0-9]+\.[0-9]+\.[0-9]+.*)$ ]]; then
            echo "::error::Tag '${tag}' does not match crate@vX.Y.Z"
            exit 1
          fi
          crate="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
          manifest="crates/${crate}/Cargo.toml"
          if [[ ! -f "$manifest" ]]; then
            echo "::error::Unknown crate '${crate}' (missing ${manifest})"
            exit 1
          fi
          name=$(grep -m1 '^name = ' "$manifest" | sed 's/.*"\(.*\)".*/\1/')
          cargo_version=$(grep -m1 '^version = ' "$manifest" | sed 's/.*"\(.*\)".*/\1/')
          if [[ "$name" != "$crate" ]]; then
            echo "::error::Package name '${name}' does not match tag crate '${crate}'"
            exit 1
          fi
          if [[ "$cargo_version" != "$version" ]]; then
            echo "::error::Tag version '${version}' does not match ${manifest} version '${cargo_version}'"
            exit 1
          fi

          {
            echo "crate=${crate}"
            echo "crate_name=${name}"
            echo "crate_version=${version}"
            echo "git_tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing ${name} ${version} from tag ${tag}"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        run: cargo publish -p "${{ steps.meta.outputs.crate }}" --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Write release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.crate_version }}"
          changelog="crates/${{ steps.meta.outputs.crate }}/CHANGELOG.md"
          {
            echo "## What's new"
            echo ""
            awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' "$changelog"
          } > RELEASE_NOTES.md
          if [[ ! -s RELEASE_NOTES.md ]] || ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No CHANGELOG section found for version ${version} in ${changelog}"
            exit 1
          fi
          body_lines=$(tail -n +3 RELEASE_NOTES.md | sed '/^[[:space:]]*$/d' | wc -l | tr -d ' ')
          if [[ "$body_lines" -lt 1 ]]; then
            echo "::error::CHANGELOG section for ${version} is empty in ${changelog}"
            exit 1
          fi

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.meta.outputs.git_tag }}
          name: ${{ steps.meta.outputs.git_tag }}
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: true
