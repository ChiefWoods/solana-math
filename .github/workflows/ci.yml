name: CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/basis-points/Cargo.toml
      - crates/basis-points/src/**
      - crates/wrapped-decimal/Cargo.toml
      - crates/wrapped-decimal/src/**
      - crates/solana-math/Cargo.toml
      - crates/solana-math/src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    env:
      NO_HUSKY_HOOKS: 1
    name: Check, fmt, clippy, docs, and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace)
        run: cargo check --workspace --all-features --locked

      - name: Cargo fmt (check only)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Cargo doc (workspace)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace --all-features --locked
