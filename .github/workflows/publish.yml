name: Publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate
        required: true
        default: basis-points
        type: choice
        options:
          - basis-points
          - wrapped-decimal
          - solana-safe-math
      level:
        description: Version bump level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - version
      version:
        description: Exact version (only when level is "version")
        required: false
        type: string
      dry_run:
        description: Dry run (no publish, tag, push, or GitHub release)
        required: true
        default: true
        type: boolean
      create_release:
        description: Create a GitHub release with git-cliff notes
        required: true
        default: true
        type: boolean
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ github.event_name == 'workflow_dispatch' && format('Publish {0}', inputs.crate) || 'Publish pending crates' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: release
    env:
      NO_HUSKY_HOOKS: 1

    steps:
      - name: Verify publish prerequisites
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Publish must be run from the main branch (current ref: ${GITHUB_REF})."
            exit 1
          fi

          success_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [ "${success_count}" -lt 1 ]; then
            echo "::error::Tests workflow has not completed successfully on commit ${GITHUB_SHA}."
            echo "Wait for Tests to pass on main, then retry."
            exit 1
          fi

          echo "Publish prerequisites satisfied (main @ ${GITHUB_SHA}, Tests passed)."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install release tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release,git-cliff

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Validate version input
        if: github.event_name == 'workflow_dispatch' && inputs.level == 'version' && inputs.version == ''
        run: |
          echo 'version input is required when level is "version"' >&2
          exit 1

      - name: Set git author
        if: >-
          github.event_name == 'workflow_run' ||
          (github.event_name == 'workflow_dispatch' && inputs.dry_run != true)
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Detect pending releases
        if: github.event_name == 'workflow_run'
        id: detect
        run: |
          chmod +x ./scripts/detect-pending-releases.sh
          pending=$(./scripts/detect-pending-releases.sh)
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"
          if [ "${pending}" = "[]" ]; then
            echo "No pending releases for this commit."
          else
            echo "Pending releases: ${pending}"
          fi

      - name: Publish pending crates
        if: github.event_name == 'workflow_run' && steps.detect.outputs.pending != '[]'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CREATE_RELEASE: "true"
        run: |
          chmod +x ./scripts/publish-pending.sh ./scripts/publish.sh
          ./scripts/publish-pending.sh

      - name: Dry-run release
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh "${{ inputs.crate }}" "${{ inputs.level }}" --dry-run

      - name: Publish crate
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh "${{ inputs.crate }}" "${{ inputs.level }}"

      - name: Generate release notes
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run != true &&
          inputs.create_release
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: ${{ steps.publish.outputs.old_git_tag }}..${{ steps.publish.outputs.new_git_tag }} --include-path "${{ inputs.crate }}/**"
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.dry_run != true &&
          inputs.create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.publish.outputs.new_git_tag }}
          name: ${{ steps.publish.outputs.new_git_tag }}
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
