name: Publish

on:
  workflow_dispatch:
    inputs:
      crate:
        description: Crate
        required: true
        default: basis-points
        type: choice
        options:
          - basis-points
          - wrapped-decimal
          - solana-safe-math
      level:
        description: Version bump level
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - version
      version:
        description: Exact version (only when level is "version")
        required: false
        type: string
      dry_run:
        description: Dry run (no publish, tag, push, or GitHub release)
        required: true
        default: true
        type: boolean
      create_release:
        description: Create a GitHub release with git-cliff notes
        required: true
        default: true
        type: boolean

concurrency:
  group: publish-${{ github.workflow }}-${{ inputs.crate }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.crate }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    env:
      NO_HUSKY_HOOKS: 1

    steps:
      - name: Verify publish prerequisites
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Publish must be run from the main branch (current ref: ${GITHUB_REF})."
            exit 1
          fi

          success_count=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [ "${success_count}" -lt 1 ]; then
            echo "::error::Tests workflow has not completed successfully on commit ${GITHUB_SHA}."
            echo "Wait for Tests to pass on main, then retry."
            exit 1
          fi

          echo "Publish prerequisites satisfied (main @ ${GITHUB_SHA}, Tests passed)."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-release
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2

      - name: Validate version input
        if: inputs.level == 'version' && inputs.version == ''
        run: |
          echo 'version input is required when level is "version"' >&2
          exit 1

      - name: Set git author
        if: inputs.dry_run != true
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Dry-run release
        if: inputs.dry_run
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh "${{ inputs.crate }}" "${{ inputs.level }}" --dry-run

      - name: Publish crate
        if: inputs.dry_run != true
        id: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x ./scripts/publish.sh
          ./scripts/publish.sh "${{ inputs.crate }}" "${{ inputs.level }}"

      - name: Generate release notes
        if: inputs.dry_run != true && inputs.create_release
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: ${{ steps.publish.outputs.old_git_tag }}..${{ steps.publish.outputs.new_git_tag }} --include-path "${{ inputs.crate }}/**"
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub release
        if: inputs.dry_run != true && inputs.create_release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.publish.outputs.new_git_tag }}
          name: ${{ steps.publish.outputs.new_git_tag }}
          bodyFile: RELEASE_NOTES.md
          token: ${{ secrets.GITHUB_TOKEN }}
